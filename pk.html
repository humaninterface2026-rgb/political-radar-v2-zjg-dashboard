<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>即時聲量 PK 擂台｜張嘉郡 vs 劉建國</title>
<style>
  :root{
    --a:#2f6fed; --a2:#5a9bff; --b:#16a34a; --b2:#34d97a;
    --bg0:#0a1020; --bg1:#0f1830; --card:#141d33; --card2:#18223c;
    --line:#243152; --txt:#e8eefc; --muted:#9fb0d0;
    --green:#22c55e; --yellow:#d6a31a; --red:#ef4444;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:radial-gradient(1200px 600px at 20% -10%,#16264e 0%,var(--bg0) 55%),
            radial-gradient(1000px 600px at 90% 0%,#3a1340 0%,transparent 50%),var(--bg0);
            color:var(--txt);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;}
  .wrap{max-width:1180px;margin:0 auto;padding:18px 16px 40px}
  .gate{display:none;max-width:560px;margin:14vh auto;background:var(--card);border:1px solid var(--line);
        border-radius:16px;padding:30px;text-align:center;line-height:1.8}
  .gate a{color:var(--a2);font-weight:700}

  /* ── header ─────────────────────────────── */
  .hd{text-align:center;margin:6px 0 4px}
  .hd .t{font-size:26px;font-weight:900;letter-spacing:2px;
         background:linear-gradient(90deg,var(--a2),#fff 50%,var(--b2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hd .u{color:var(--muted);font-size:12px;margin-top:2px}

  .vs{display:grid;grid-template-columns:1fr 120px 1fr;gap:14px;align-items:center;margin:14px 0 8px}
  .cand{display:flex;gap:14px;align-items:center;padding:14px;border-radius:18px;border:1px solid var(--line);
        background:linear-gradient(135deg,rgba(47,111,237,.10),transparent 60%)}
  .cand.b{flex-direction:row-reverse;text-align:right;background:linear-gradient(225deg,rgba(22,163,74,.12),transparent 60%)}
  .cand .pic{width:108px;height:108px;border-radius:50%;object-fit:cover;flex:0 0 auto;
             border:3px solid var(--a);box-shadow:0 0 22px rgba(47,111,237,.45)}
  .cand.b .pic{border-color:var(--b);box-shadow:0 0 22px rgba(22,163,74,.45)}
  .cand .nm{font-size:24px;font-weight:900;line-height:1.1}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;margin-top:5px;
         background:rgba(47,111,237,.2);color:var(--a2);border:1px solid rgba(47,111,237,.4)}
  .cand.b .badge{background:rgba(22,163,74,.2);color:var(--b2);border-color:rgba(22,163,74,.4)}
  .mini{margin-top:9px;font-size:12px;color:var(--muted)}
  .mini b{font-size:18px;color:var(--txt)}
  .mini .g{color:var(--green)} .mini .r{color:var(--red)}
  .vol{font-size:22px;font-weight:900;margin-top:6px}
  .cand.a .vol{color:var(--a2)} .cand.b .vol{color:var(--b2)}

  .vsmid{text-align:center}
  .vsmid .vt{font-size:30px;font-weight:900;font-style:italic;
             background:linear-gradient(180deg,#fff,#8fa6d6);-webkit-background-clip:text;background-clip:text;color:transparent}
  .vbar{height:12px;border-radius:8px;overflow:hidden;display:flex;margin-top:8px;border:1px solid var(--line)}
  .vbar i{display:block;height:100%}
  .vbar .ia{background:linear-gradient(90deg,var(--a),var(--a2))}
  .vbar .ib{background:linear-gradient(90deg,var(--b2),var(--b))}

  /* ── platform rows ──────────────────────── */
  .tbl{margin-top:14px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card)}
  .thead,.prow{display:grid;grid-template-columns:1fr 300px 1fr}
  .thead{background:var(--card2);border-bottom:1px solid var(--line);font-size:13px;color:var(--muted);font-weight:700}
  .thead>div{padding:11px 16px;text-align:center}
  .thead .la{text-align:left;color:var(--a2)} .thead .lb{text-align:right;color:var(--b2)}
  .prow{border-bottom:1px solid var(--line)}
  .prow:last-child{border-bottom:none}
  .side{padding:16px;display:flex;gap:14px;align-items:center}
  .side.b{flex-direction:row-reverse}
  .side .num{font-size:26px;font-weight:900}
  .side.a .num{color:var(--a2)} .side.b .num{color:var(--b2)}
  .side .num small{display:block;font-size:11px;color:var(--muted);font-weight:600;text-align:center}
  .bars{flex:1;min-width:0}
  .bar{display:flex;align-items:center;gap:8px;font-size:12px;margin:3px 0;color:var(--muted)}
  .side.b .bar{flex-direction:row-reverse}
  .bar .lbl{width:30px;flex:0 0 auto}
  .bar .track{flex:1;height:7px;border-radius:6px;background:#0e1730;overflow:hidden}
  .bar .fill{height:100%;border-radius:6px}
  .bar .pct{width:34px;flex:0 0 auto;text-align:right;color:var(--txt);font-weight:700}
  .side.b .bar .pct{text-align:left}
  .fg{background:var(--green)} .fy{background:var(--yellow)} .fr{background:var(--red)}
  .donut{width:64px;height:64px;border-radius:50%;flex:0 0 auto;position:relative}
  .donut::after{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--card)}
  .donut .c{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;z-index:1}

  .mid{padding:16px 14px;border-left:1px solid var(--line);border-right:1px solid var(--line);
       display:flex;flex-direction:column;justify-content:center;gap:8px;background:rgba(255,255,255,.015)}
  .mid .picon{text-align:center;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:1px}
  .mslider{position:relative;height:8px;border-radius:6px;background:#0e1730;margin:2px 6px}
  .mslider .ka{position:absolute;left:0;top:0;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--a),var(--a2))}
  .mslider .dot{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 8px rgba(0,0,0,.5)}
  .mnums{display:flex;justify-content:space-between;font-size:12px;font-weight:800}
  .mnums .a{color:var(--a2)} .mnums .b{color:var(--b2)}
  .lead{font-size:11px;text-align:center;color:var(--muted);background:#0e1730;border:1px solid var(--line);
        border-radius:8px;padding:6px 8px;line-height:1.5}
  .lead b{color:var(--txt)}

  /* ── overview ───────────────────────────── */
  .ov{margin-top:14px;border:1px solid var(--line);border-radius:16px;background:var(--card);
      display:grid;grid-template-columns:1fr 160px 1fr;padding:16px}
  .ov .col{padding:6px 14px}
  .ov .col.b{text-align:right}
  .ov .big{font-size:30px;font-weight:900}
  .ov .col.a .big{color:var(--a2)} .ov .col.b .big{color:var(--b2)}
  .ov .row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin:4px 0}
  .ov .col.b .row{flex-direction:row-reverse}
  .ov .row .track{flex:1;height:7px;border-radius:6px;background:#0e1730;overflow:hidden}
  .ov .mid2{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
  .ov .mid2 .vt{font-size:22px;font-weight:900;font-style:italic;color:#9fb0d6}
  .ov .mid2 .ld{font-size:11px;color:var(--muted);text-align:center}
  .ov .mid2 .ld b{display:block;font-size:20px}

  .foot{text-align:center;color:var(--muted);font-size:11px;margin-top:14px;line-height:1.7}
  @media(max-width:820px){
    .vs{grid-template-columns:1fr;gap:10px} .vsmid{order:-1}
    .thead,.prow,.ov{grid-template-columns:1fr} .thead .lb,.ov .col.b{text-align:left}
    .side.b,.cand.b{flex-direction:row} .cand.b{text-align:left}
    .mid{border-left:none;border-right:none;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  }
</style>
</head>
<body>
  <div id="gate" class="gate">
    <h2>⚔️ 即時聲量 PK 擂台</h2>
    <p>這頁要先在<a href="./index.html">主儀表板</a>登入後才看得到資料（共用同一個登入）。<br>
    請先到 <a href="./index.html">主儀表板</a> 登入，再回到這頁。</p>
    <p id="gateErr" style="color:var(--red);font-size:12px"></p>
  </div>

  <div id="app" class="wrap" style="display:none">
    <div class="hd">
      <div class="t">⚔️ 即時聲量 PK 擂台</div>
      <div class="u">張嘉郡 <span style="opacity:.6">vs</span> 劉建國　·　更新時間：<span id="upd">—</span>　·　聲量＝最新貼文讚/愛心數</div>
    </div>

    <div class="vs">
      <div class="cand a">
        <img class="pic" src="./assets/zhang.jpg" alt="張嘉郡" />
        <div>
          <div class="nm">張嘉郡</div><span class="badge">A · 國民黨</span>
          <div class="mini">正評 <b class="g" id="aPos">—</b>%　負評 <b class="r" id="aNeg">—</b>%</div>
          <div class="vol">總聲量 <span id="aVol">—</span></div>
        </div>
      </div>
      <div class="vsmid">
        <div class="vt">VS</div>
        <div class="vbar"><i class="ia" id="vbA" style="width:50%"></i><i class="ib" id="vbB" style="width:50%"></i></div>
        <div style="font-size:11px;color:var(--muted);margin-top:6px" id="vsLead">—</div>
      </div>
      <div class="cand b">
        <img class="pic" src="./assets/liu.jpg" alt="劉建國" />
        <div>
          <div class="nm">劉建國</div><span class="badge">B · 民進黨</span>
          <div class="mini">正評 <b class="g" id="bPos">—</b>%　負評 <b class="r" id="bNeg">—</b>%</div>
          <div class="vol">總聲量 <span id="bVol">—</span></div>
        </div>
      </div>
    </div>

    <div class="tbl">
      <div class="thead"><div class="la">A 候選人 張嘉郡</div><div>聲量 PK 對比</div><div class="lb">B 候選人 劉建國</div></div>
      <div id="rows"></div>
    </div>

    <div class="ov" id="ov"></div>

    <div class="foot">聲量＝各候選人「最新貼文」的讚/愛心數（隨採集自動更新）；正/中立/負評與評價總數為近 7 天留言的 AI 情緒分析結果，僅供參考。</div>
  </div>

  <script defer src="./lib/config.js?v=2026-05-18-customer-cfg"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="./lib/db.js?v=2026-06-02-comments-subject"></script>
  <script>
  window.addEventListener('DOMContentLoaded', function(){ setTimeout(boot, 300); });

  var PLATS = [['facebook','Facebook'],['instagram','Instagram'],['threads','Threads']];
  var SUBS = { A:'張嘉郡', B:'劉建國' };

  function pct(n,d){ return d>0 ? Math.round(n/d*100) : 0; }
  function tally(rows){
    var t={total:rows.length,green:0,yellow:0,red:0};
    rows.forEach(function(c){ if(c.signal==='green')t.green++; else if(c.signal==='yellow')t.yellow++; else if(c.signal==='red')t.red++; });
    t.gp=pct(t.green,t.total); t.yp=pct(t.yellow,t.total); t.rp=pct(t.red,t.total);
    return t;
  }
  function donut(t){
    var g=t.gp,y=t.yp,r=t.rp, s1=g, s2=g+y;
    var bg='conic-gradient(var(--green) 0% '+g+'%, var(--yellow) '+g+'% '+s2+'%, var(--red) '+s2+'% 100%)';
    return '<div class="donut" style="background:'+bg+'"><div class="c">'+t.total+'</div></div>';
  }
  function bars(t){
    function b(lbl,cls,p){ return '<div class="bar"><span class="lbl">'+lbl+'</span><span class="track"><span class="fill '+cls+'" style="width:'+p+'%"></span></span><span class="pct">'+p+'%</span></div>'; }
    return '<div class="bars">'+b('正評','fg',t.gp)+b('中立','fy',t.yp)+b('負評','fr',t.rp)
      +'<div style="font-size:11px;color:var(--muted);margin-top:4px">評價（近7天）<b style="color:var(--txt)">'+t.total+'</b> 則</div></div>';
  }

  async function boot(){
    try{
      if(typeof LxyDB==='undefined') throw new Error('LxyDB 未載入');
      // 聲量＝最新貼文讚/愛心數（Supabase pk_voice，受權限保護、FB 由爬蟲自動更新）；情緒＝留言燈號（Supabase）
      var voiceResp=await LxyDB.client().rpc('get_pk_voice');
      if(voiceResp&&voiceResp.error) throw new Error('rpc_fail');
      var voice=(voiceResp&&voiceResp.data)||{voice:{}};
      var V=(voice&&voice.voice)||{};
      var data={A:{},B:{}};
      for(var s in SUBS){
        for(var i=0;i<PLATS.length;i++){
          var p=PLATS[i][0];
          var rows=await LxyDB.recentComments(p,5000,168,SUBS[s]).catch(function(){return null;});
          if(rows===null) throw new Error('rpc_fail');
          var t=tally(rows); t.likes=((V[SUBS[s]]||{})[p])||0; data[s][p]=t;
        }
      }
      render(data, voice.updated);
      document.getElementById('app').style.display='';
    }catch(e){
      document.getElementById('gate').style.display='';
      if(/rpc_fail|JWT|auth|401|permission/i.test(String(e.message||e)))
        document.getElementById('gateErr').textContent='（讀不到資料：多半是還沒登入）';
      else document.getElementById('gateErr').textContent='載入失敗：'+(e.message||e);
    }
  }

  function agg(side,data){
    var a={total:0,green:0,yellow:0,red:0,likes:0};
    PLATS.forEach(function(p){ var t=data[side][p[0]]; a.total+=t.total;a.green+=t.green;a.yellow+=t.yellow;a.red+=t.red;a.likes+=(t.likes||0); });
    a.gp=pct(a.green,a.total);a.yp=pct(a.yellow,a.total);a.rp=pct(a.red,a.total);
    return a;
  }

  function render(data, updated){
    document.getElementById('upd').textContent=updated||new Date().toLocaleString('zh-TW',{hour12:false});
    var A=agg('A',data), B=agg('B',data);
    document.getElementById('aPos').textContent=A.gp; document.getElementById('aNeg').textContent=A.rp;
    document.getElementById('bPos').textContent=B.gp; document.getElementById('bNeg').textContent=B.rp;
    document.getElementById('aVol').textContent=A.likes.toLocaleString();
    document.getElementById('bVol').textContent=B.likes.toLocaleString();
    var tot=A.likes+B.likes||1;
    document.getElementById('vbA').style.width=(A.likes/tot*100)+'%';
    document.getElementById('vbB').style.width=(B.likes/tot*100)+'%';
    var lead=A.likes-B.likes;
    document.getElementById('vsLead').innerHTML = lead===0 ? '聲量平手'
      : (lead>0?'🔵 張嘉郡':'🟢 劉建國')+' 聲量領先 <b>'+Math.abs(lead).toLocaleString()+'</b>';

    // platform rows
    var html='';
    PLATS.forEach(function(p){
      var ta=data.A[p[0]], tb=data.B[p[0]], t=ta.likes+tb.likes||1;
      var aw=Math.round(ta.likes/t*100);
      var ld=ta.likes-tb.likes;
      var ldtxt = ld===0 ? '兩邊聲量相當'
        : '<b>'+(ld>0?'張嘉郡':'劉建國')+'</b> '+p[1]+' 聲量領先 <b>'+Math.abs(ld).toLocaleString()+'</b>'+(Math.max(ta.likes,tb.likes)?'（約 '+Math.round(Math.abs(ld)/Math.max(ta.likes,tb.likes)*100)+'%）':'');
      html+='<div class="prow">'
        +'<div class="side a"><div class="num">'+ta.likes.toLocaleString()+'<small>聲量·讚/愛心</small></div>'+bars(ta)+donut(ta)+'</div>'
        +'<div class="mid"><div class="picon">'+p[1]+'</div>'
          +'<div class="mnums"><span class="a">'+ta.likes.toLocaleString()+'</span><span class="b">'+tb.likes.toLocaleString()+'</span></div>'
          +'<div class="mslider"><span class="ka" style="width:'+aw+'%"></span><span class="dot" style="left:'+aw+'%"></span></div>'
          +'<div class="lead">'+ldtxt+'</div></div>'
        +'<div class="side b"><div class="num">'+tb.likes.toLocaleString()+'<small>聲量·讚/愛心</small></div>'+bars(tb)+donut(tb)+'</div>'
      +'</div>';
    });
    document.getElementById('rows').innerHTML=html;

    // overview
    function orow(lbl,cls,p,side){ return '<div class="row">'+(side==='a'?'<span style="width:42px">'+lbl+'</span>':'')+'<span class="track"><span class="fill '+cls+'" style="width:'+p+'%;display:block;height:100%"></span></span><span style="width:34px;color:var(--txt);font-weight:700">'+p+'%</span>'+(side==='b'?'<span style="width:42px">'+lbl+'</span>':'')+'</div>'; }
    var olead=A.likes-B.likes;
    document.getElementById('ov').innerHTML=
      '<div class="col a"><div class="big">'+A.likes.toLocaleString()+'</div><div style="font-size:12px;color:var(--muted);margin-bottom:6px">總聲量（讚/愛心）· 評價（近7天）'+A.total+' 則</div>'
        +orow('正評','fg',A.gp,'a')+orow('中立','fy',A.yp,'a')+orow('負評','fr',A.rp,'a')+'</div>'
      +'<div class="mid2"><div class="vt">VS</div><div class="ld">目前領先<b>'+(olead>=0?'張嘉郡':'劉建國')+'</b>'+Math.abs(olead).toLocaleString()+'</div></div>'
      +'<div class="col b"><div class="big">'+B.likes.toLocaleString()+'</div><div style="font-size:12px;color:var(--muted);margin-bottom:6px">總聲量（讚/愛心）· 評價（近7天）'+B.total+' 則</div>'
        +orow('正評','fg',B.gp,'b')+orow('中立','fy',B.yp,'b')+orow('負評','fr',B.rp,'b')+'</div>';
  }
  </script>
</body>
</html>
